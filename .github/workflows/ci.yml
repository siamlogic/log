name: CI / Build & Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "cbt-ci-test-secret-32-characters-minimum"
      MFA_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NODE_ENV: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed Test Database
        run: npm run db:push && npm run db:seed

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Start Application in Background
        run: npm run start &

      - name: Wait for Server Readiness
        run: npx wait-on http://localhost:3001/api/auth/me --timeout 15000

      - name: Run Automated Test Suite (48 Tests)
        run: npm test

      - name: Run Security Audit Penetration Test (21 Tests)
        run: node test/security-audit.js
